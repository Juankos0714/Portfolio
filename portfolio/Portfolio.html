<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juan Camilo Rojas — Desarrollador Fullstack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', Helvetica, sans-serif;
      --mono: 'DM Mono', 'Courier New', monospace;

      --bg:         oklch(0.97 0.012 75);
      --fg:         oklch(0.13 0.015 50);
      --muted:      oklch(0.48 0.015 55);
      --border:     oklch(0.88 0.012 75);
      --accent:     oklch(0.52 0.15 35);
      --accent-glow: oklch(0.52 0.15 35 / 0.06);
      --card:       oklch(0.95 0.010 75);
      --section-bg: oklch(0.94 0.014 75);
      --tech-blue:  oklch(0.52 0.13 240);
    }

    [data-theme="dark"] {
      --bg:         oklch(0.12 0.012 50);
      --fg:         oklch(0.93 0.008 75);
      --muted:      oklch(0.60 0.010 60);
      --border:     oklch(0.22 0.012 50);
      --accent:     oklch(0.65 0.15 35);
      --accent-glow: oklch(0.65 0.15 35 / 0.08);
      --card:       oklch(0.16 0.012 50);
      --section-bg: oklch(0.15 0.012 50);
      --tech-blue:  oklch(0.62 0.13 240);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      transition: background 0.4s, color 0.4s;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button { font-family: inherit; }

    /* Tweaks panel */
    #tweaks-panel {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: var(--bg); border: 1px solid var(--border);
      padding: 20px 24px; width: 260px; display: none;
      box-shadow: 0 8px 32px oklch(0 0 0 / 0.12);
    }
    #tweaks-panel.visible { display: block; }
    #tweaks-panel h4 {
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); font-family: var(--mono); margin-bottom: 16px;
    }
    .tweak-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .tweak-row label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .tweak-row input[type=range] { width: 100%; accent-color: var(--accent); }
    .tweak-row select {
      background: var(--card); border: 1px solid var(--border); color: var(--fg);
      padding: 5px 8px; font-size: 11px; font-family: var(--mono); width: 100%;
    }

    @keyframes photoRock {
      0%   { transform: rotate(-1.5deg); }
      50%  { transform: rotate(1.5deg); }
      100% { transform: rotate(-1.5deg); }
    }

    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
    }
  </style>

  <!-- Data -->
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Diagrams -->
  <script type="text/babel" src="Diagrams.jsx"></script>
  <!-- Hero -->
  <script type="text/babel" src="Hero.jsx"></script>
  <!-- Projects -->
  <script type="text/babel" src="Projects.jsx"></script>
  <!-- About -->
  <script type="text/babel" src="About.jsx"></script>

  <script type="text/babel">
    // ── Contact ──────────────────────────────────────────────────────────────
    const Contact = () => {
      const { email, github, linkedin, location } = window.PORTFOLIO_DATA;
      return (
        <section id="contacto" style={{ padding: '96px 48px', maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 48, alignItems: 'end' }}>
            <div>
              <span style={{ fontSize: 10, letterSpacing: '0.3em', textTransform: 'uppercase', color: 'var(--muted)', fontFamily: 'var(--mono)', display: 'block', marginBottom: 40 }}>
                Contacto
              </span>
              <h2 style={{
                fontFamily: 'var(--serif)', fontWeight: 400,
                fontSize: 'clamp(3rem, 7vw, 6rem)', lineHeight: 0.95,
                letterSpacing: '-0.02em', marginBottom: 48
              }}>
                Trabajemos<br/>
                <em style={{ color: 'var(--accent)' }}>juntos</em>
              </h2>
              <p style={{ fontSize: 15, color: 'var(--muted)', maxWidth: 480, lineHeight: 1.8, marginBottom: 48 }}>
                Siempre abierto a proyectos interesantes, colaboraciones o simplemente una buena conversación sobre tecnología.
              </p>
              <a href={`mailto:${email}`} style={{
                display: 'inline-flex', alignItems: 'center', gap: 20,
                textDecoration: 'none', color: 'var(--fg)',
                fontFamily: 'var(--serif)', fontSize: 'clamp(1.1rem, 2.5vw, 1.6rem)',
                fontWeight: 400, transition: 'color 0.3s'
              }}
              onMouseEnter={e => e.currentTarget.style.color = 'var(--accent)'}
              onMouseLeave={e => e.currentTarget.style.color = 'var(--fg)'}
              >
                {email}
                <span style={{
                  width: 44, height: 44, border: '1px solid currentColor',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 20, flexShrink: 0, transition: 'all 0.3s'
                }}>→</span>
              </a>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 32, paddingBottom: 8 }}>
              <div>
                <span style={{ fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase', color: 'var(--muted)', fontFamily: 'var(--mono)', display: 'block', marginBottom: 10 }}>Ubicación</span>
                <p style={{ fontSize: 13, lineHeight: 1.7, color: 'var(--fg)' }}>
                  {location}<br/>
                  <span style={{ color: 'var(--muted)' }}>Disponible de forma remota</span>
                </p>
              </div>
              <div>
                <span style={{ fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase', color: 'var(--muted)', fontFamily: 'var(--mono)', display: 'block', marginBottom: 10 }}>Redes</span>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {[['GitHub', github], ['LinkedIn', linkedin]].map(([l, h]) => (
                    <a key={l} href={h} target="_blank" rel="noopener noreferrer" style={{
                      fontSize: 13, color: 'var(--muted)', textDecoration: 'none', transition: 'color 0.3s'
                    }}
                    onMouseEnter={e => e.currentTarget.style.color = 'var(--accent)'}
                    onMouseLeave={e => e.currentTarget.style.color = 'var(--muted)'}
                    >{l} ↗</a>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ── Footer ────────────────────────────────────────────────────────────────
    const Footer = () => (
      <footer style={{
        borderTop: '1px solid var(--border)', padding: '24px 48px',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center'
      }}>
        <span style={{ fontSize: 11, color: 'var(--muted)', fontFamily: 'var(--mono)' }}>Juan Camilo Rojas Ospina © 2026</span>
        <span style={{ fontSize: 11, color: 'var(--muted)', fontFamily: 'var(--mono)' }}>Desarrollador Fullstack</span>
      </footer>
    );

    // ── Tweaks Panel ──────────────────────────────────────────────────────────
    const TWEAK_DEFAULTS = {
      "accentHue": 35,
      "fontScale": 100,
      "sectionSpacing": 96
    };

    const TweaksPanel = ({ tweaks, setTweaks }) => (
      <div id="tweaks-panel">
        <h4>Tweaks</h4>
        <div className="tweak-row">
          <label>Accent Hue — {tweaks.accentHue}°</label>
          <input type="range" min="0" max="360" step="5" value={tweaks.accentHue}
            onChange={e => setTweaks(t => ({ ...t, accentHue: +e.target.value }))} />
        </div>
        <div className="tweak-row">
          <label>Escala de texto — {tweaks.fontScale}%</label>
          <input type="range" min="80" max="120" step="2" value={tweaks.fontScale}
            onChange={e => setTweaks(t => ({ ...t, fontScale: +e.target.value }))} />
        </div>
        <div className="tweak-row">
          <label>Espaciado secciones — {tweaks.sectionSpacing}px</label>
          <input type="range" min="48" max="160" step="8" value={tweaks.sectionSpacing}
            onChange={e => setTweaks(t => ({ ...t, sectionSpacing: +e.target.value }))} />
        </div>
      </div>
    );

    // ── App ───────────────────────────────────────────────────────────────────
    const App = () => {
      const [dark, setDark] = React.useState(() => {
        try { return localStorage.getItem('portfolio-theme') === 'dark'; } catch { return false; }
      });
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        try { localStorage.setItem('portfolio-theme', dark ? 'dark' : 'light'); } catch {}
      }, [dark]);

      React.useEffect(() => {
        const root = document.documentElement;
        const l = dark ? 0.65 : 0.52;
        root.style.setProperty('--accent', `oklch(${l} 0.15 ${tweaks.accentHue})`);
        root.style.setProperty('--accent-glow', `oklch(${l} 0.15 ${tweaks.accentHue} / 0.07)`);
        root.style.fontSize = `${tweaks.fontScale}%`;
        document.querySelectorAll('section').forEach(s => {
          s.style.paddingTop = tweaks.sectionSpacing + 'px';
          s.style.paddingBottom = tweaks.sectionSpacing + 'px';
        });
      }, [tweaks, dark]);

      React.useEffect(() => {
        const toggle = (e) => {
          if (e.data?.type === '__activate_edit_mode') {
            document.getElementById('tweaks-panel')?.classList.add('visible');
          }
          if (e.data?.type === '__deactivate_edit_mode') {
            document.getElementById('tweaks-panel')?.classList.remove('visible');
          }
        };
        window.addEventListener('message', toggle);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', toggle);
      }, []);

      React.useEffect(() => {
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
      }, [tweaks]);

      return (
        <>
          <window.Hero dark={dark} toggleDark={() => setDark(d => !d)} />
          <window.Projects />
          <window.About />
          <Contact />
          <Footer />
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
